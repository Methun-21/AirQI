name: Hourly Data Collection and Model Training

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OW_API_KEY: ${{ secrets.OW_API_KEY }}
      WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
      ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest Automated Tests
        run: python -m pytest tests/ -v

      - name: Collect Telemetry into Database & CSV
        run: python collect_data.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions-bot@github.com"
          
          git add delhi_aqi_data_waqi.csv airaware.db
          
          if git diff --staged --quiet; then
            echo "No new telemetry to commit."
          else
            git commit -m "Automated Telemetry Collection (SQLite DB & CSV)"
            git push
          fi
