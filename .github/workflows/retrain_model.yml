name: Continuous Training (MLOps Retraining)

on:
  schedule:
    # Run at 00:00 every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite Before Training
        run: python -m pytest tests/ -v

      - name: Run ML Training Pipeline
        run: |
          echo "Starting Automated Model Retraining..."
          python train_model.py
          echo "Training Complete."

      - name: Run Accuracy Evaluation
        run: |
          echo "Generating accuracy metrics and plots..."
          python evaluate_accuracy.py

      - name: Commit and Push Updated Metrics & DB Logs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add airaware.db accuracy_report.txt accuracy_plot.png || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit (Metrics & DB unchanged)"
          else
            git commit -m "MLOps: Automated Model Retraining & DB Log Update"
            git push
          fi
