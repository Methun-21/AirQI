name: Automated Model Retraining & Benchmark (MLOps)

on:
  schedule:
    # Run at 00:00 UTC every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  retrain-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite Before Retraining
        run: |
          python -m pytest tests/ -v

      - name: Execute Retraining Pipeline & Spatial LOSO-CV
        run: |
          echo "Starting Automated ML Retraining..."
          python train_model.py
          echo "Training & Validation Complete."

      - name: Generate Diagnostic Plots & Reports
        run: |
          python evaluate_accuracy.py

      - name: Commit & Push Retrained Artifacts and Reports
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add airaware.db accuracy_report.txt accuracy_plot.png models/benchmark_report.json || true
          
          if git diff --staged --quiet; then
            echo "No changes in metrics or models to commit."
          else
            git commit -m "MLOps: Automated Model Retraining & Accuracy Report [skip ci]"
            git pull --rebase origin main || true
            git push origin main || git push || echo "Push skipped or succeeded."
          fi
